name: Daylight Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Configure optional integrations and signing
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          names = ('LASTFM_API_KEY', 'LASTFM_SECRET', 'LISTEN_TOGETHER_SERVER', 'DISCORD_APPLICATION_ID')
          Path('local.properties').write_text(''.join(f'{name}={prop(os.environ.get(name, ""))}\n' for name in names))
          signing = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(os.environ.get(name) for name in signing):
              if not all(os.environ.get(name) for name in signing):
                  raise SystemExit('All four signing secrets must be configured together')
              Path('daylight-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              Path('keystore.properties').write_text('storeFile=daylight-release.jks\n' + ''.join(f'{key}={prop(os.environ[name])}\n' for key, name in [('storePassword', 'KEYSTORE_PASSWORD'), ('keyAlias', 'KEY_ALIAS'), ('keyPassword', 'KEY_PASSWORD')]))
          PY
      - name: Android tests
        run: ./gradlew :app:testDevDebugUnitTest --console=plain
      - name: Build APKs
        run: ./gradlew :app:assembleDevDebug :app:assembleProdRelease --console=plain
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: daylight-android
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-android-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
