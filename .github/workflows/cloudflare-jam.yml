name: Cloudflare Jam checks
on:
  push:
    paths: ['cloudflare-jam/**', '.github/workflows/cloudflare-jam.yml']
  pull_request:
    paths: ['cloudflare-jam/**', '.github/workflows/cloudflare-jam.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-jam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-jam/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
